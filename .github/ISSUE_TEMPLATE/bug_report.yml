name: Bug report
description: The bar shows, hides, or animates in a way the docs say it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what the bar did instead.
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a StackBlitz, a repository, or a gist. A bug with a reproduction gets fixed first. The Start-mode example is a quick start point, https://stackblitz.com/github/kecan0406/solid-route-progress/tree/main/examples/start?file=src/App.tsx
      placeholder: https://stackblitz.com/edit/...
  - type: input
    id: version
    attributes:
      label: solid-route-progress version
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: Entry point
      options:
        - solid-route-progress/router
        - solid-route-progress/navigation
        - solid-route-progress (createProgress / Progress)
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: solid-js, @solidjs/web, @solidjs/router and @solidjs/vite-plugin versions
      placeholder: solid-js 2.0.3, @solidjs/web 2.0.3, @solidjs/router 2.0.1, @solidjs/vite-plugin 3.0.1
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 152, Safari 26.2
    validations:
      required: true
